spring.application.name=nebula
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5332/nebula}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.servlet.session.timeout=${SESSION_TIMEOUT:7d}
server.servlet.session.cookie.name=NEBULA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}